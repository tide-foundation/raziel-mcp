# Attestation — Scenario Manifest

id: attestation
title: Attestation
category: threshold-signing
description: Makes a fact about people a statement the network signs with the realm's key, instead of a database row the server can edit. "Issuer attests Claim about Subject" — membership, assignment, consent, verification, approval, sharing, delegation. The statement is itself a policy, signed with a Policy:1 request under an IMPLICIT/PRIVATE rule; a custom Forseti contract decides who may attest what; the server relies on a fact only while its signature verifies.

