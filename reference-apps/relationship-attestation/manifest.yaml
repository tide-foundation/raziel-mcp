# Relationship Attestation — Scenario Manifest

id: relationship-attestation
title: Relationship Attestation
category: policy-governed-encryption
description: Gives a named user, a group or a role access to ONE record's encrypted data, enforced by the network at decryption time. The relationship (this subject is assigned to this assessment, case or record) is a policy a realm admin approves once; the built-in RelationshipAttestation contract then lets only that subject encrypt (holding _tide_encryptor) or decrypt (holding _tide_decryptor) data tagged with that record's id, and only if the policy grants that operation. No custom contract is written or deployed.

status: The contract is built into the ORK, on ORK main (c69fc4f6, 2026-10-16). Rules read from that source (User/Group/Role subjects). MEASURED end to end on ORK main by Sasha Le (2026-10-16): User, Group, realm-Role and client-Role (clientId) policies worked and the refusals (not the subject, missing _tide_decryptor, wrong or extra tag) were checked. The ORK repo has no unit tests for it. A network running an ORK build from before 2026-10-16 does not have it.

