# Attested Provenance Registry — Scenario Manifest

id: attested-provenance-registry
title: Attested Provenance Registry
category: threshold-signing
description: Issues timestamped, third-party-verifiable attestations about content. A custom Forseti contract enforces WHO signed (vuid byte-compared against the doken) and WHEN (client timestamp bounded against each ORK's own clock), so neither the app's backend nor a single compromised ORK can forge or backdate a claim. The output is a portable certificate a recipient verifies offline, without contacting the issuer.

frameworks:
  - nextjs

core_patterns:
